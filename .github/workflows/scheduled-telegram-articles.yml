name: Scheduled Telegram articles

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scheduled-telegram-articles.yml'
      - '.github/publish-telegram.py'
      - '.github/site-publications.json'
  workflow_dispatch:
  schedule:
    - cron: '0,10,20,30,40,50 3,12 24 11 *'

permissions:
  contents: write

concurrency:
  group: scheduled-telegram-articles
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Publish queued Telegram articles
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 .github/publish-telegram.py
