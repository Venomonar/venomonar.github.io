name: Scheduled site articles

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scheduled-site-articles.yml'
      - '.github/publish-site.py'
      - '.github/site-publications.json'
  workflow_dispatch:
  schedule:
    - cron: '0 3,6 27 11 *'
    - cron: '7,17,32,47 3,6 27 11 *'
    - cron: '17 4-5,7-23 27 11 *'
    - cron: '17 1,4,7 28 11 *'

permissions:
  contents: write
  pages: write

concurrency:
  group: scheduled-site-articles
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Publish articles and refresh Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/publish-site.py
